name: NEXUS validation
on:
  pull_request:
  push:
    branches: [main, feat/holographic-command-center]
jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run check
